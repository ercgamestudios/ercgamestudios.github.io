:root {
  color-scheme: light;
  --bg: #E8EDF2;
  --surface: #F6F8FB;
  --ink: #14244A;
  --muted: #56678A;
  --line: #CBD5E1;
  --accent: #C23F2D;
  --accent-ink: #FFFFFF;
  --gold: #B98F34;
  --board: #CFD9E4;
  --cell: #E7EDF3;
  --frame: #1D3F94;
  --gridline: #9FB0C6;
  --overlay: rgba(12, 24, 56, 0.58);
  --banner-h: 0px;
  --font: "Readex Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", sans-serif;
  --display: "Reem Kufi", "Readex Pro", system-ui, sans-serif;
  box-sizing: border-box;
  height: 100%;
  padding-top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
  padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B1530; --surface: #14214A; --ink: #E8EEF8; --muted: #93A3C2; --line: #263A6A;
    --accent: #E05C46; --gold: #D9B55E; --board: #0F1B3F; --cell: #18295C; --frame: #2D5AC8;
    --gridline: #3A5190; --overlay: rgba(3, 8, 22, 0.72);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1530; --surface: #14214A; --ink: #E8EEF8; --muted: #93A3C2; --line: #263A6A;
  --accent: #E05C46; --gold: #D9B55E; --board: #0F1B3F; --cell: #18295C; --frame: #2D5AC8;
  --gridline: #3A5190; --overlay: rgba(3, 8, 22, 0.72);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  overscroll-behavior: none; overflow: hidden;
}
[hidden] { display: none !important; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#app {
  height: 100%; display: flex; flex-direction: column;
  max-width: 640px; margin: 0 auto;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.hud {
  display: grid; grid-template-columns: 48px 1fr 48px; align-items: center;
  padding: 10px 14px 2px; gap: 8px;
}
.icon-btn {
  width: 46px; height: 46px; border-radius: 50%; border: 0;
  background: var(--surface); color: var(--frame);
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1.5px var(--line);
}
.icon-btn svg { width: 24px; height: 24px; }
.scorebox { text-align: center; line-height: 1; }
#score {
  font-weight: 600; font-size: 40px; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
#best { margin-top: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#moves { display: inline-block; margin-top: 5px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); font-variant-numeric: tabular-nums; }
#moves.low { background: var(--accent); color: var(--accent-ink); box-shadow: none; animation: pop 1.2s ease-in-out infinite; }
#movesNote { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.progress {
  display: flex; align-items: center; gap: 10px;
  margin: 10px 16px 0; font-size: 14px; color: var(--muted);
}
#patDot { width: 10px; height: 10px; border-radius: 3px; transform: rotate(45deg); flex: none; }
#btnTheme {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; max-width: 62%;
  padding: 0 12px 0 10px; border: 0; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line);
}
#patFlag { font-size: 20px; line-height: 1; }
#patFlag:empty { display: none; }
#patName { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { width: 14px; height: 14px; flex: none; color: var(--muted); }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
#patBar { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 3px; transition: width .45s ease; }
#patCount { font-variant-numeric: tabular-nums; white-space: nowrap; }
#btnTheme { max-width: none; flex: 0 1 auto; min-width: 0; }
.bar { min-width: 20px; }
.progress { gap: 8px; }
.mini-btn {
  flex: none; min-width: 38px; height: 38px; padding: 0 8px; border: 0; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 14px;
  background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line);
}
#btnTheme.golden { box-shadow: inset 0 0 0 2.5px var(--gold); }
.theme-item.daily { grid-column: 1 / -1; background: var(--gold); color: #1b1407; box-shadow: none; }
.theme-item.daily .theme-prog { color: #3b2d0c; }
.theme-item:disabled { opacity: .6; }
.stamp {
  display: inline-flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 8px 16px;
  border: 3px dashed var(--accent); border-radius: 999px; color: var(--accent); font-weight: 600;
  transform: rotate(-4deg); animation: stampIn .5s cubic-bezier(.2, .9, .3, 1.3);
}
#doneStampFlag { font-size: 26px; line-height: 1; }
#passport { margin: 0 0 14px; text-align: start; }
.pass-head { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.pass-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pass-stamp {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
  border: 2px dashed var(--line); opacity: .35; filter: grayscale(1);
}
.pass-stamp.on { opacity: 1; filter: none; border-color: var(--accent); }
.col-item.gold canvas { outline: 3px solid var(--gold); outline-offset: 2px; box-shadow: 0 0 14px rgba(217, 181, 94, .7); }
#btnGuess { background: var(--gold); color: #1b1407; box-shadow: none; }
#btnGuess.pop { animation: pop .6s cubic-bezier(.2, .9, .3, 1.4) 2; }
.fact { margin: 16px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--bg); text-align: start; }
.fact b { display: block; color: var(--gold); font-size: 14px; margin-bottom: 4px; }
.fact p { margin: 0; font-size: 15px; line-height: 1.4; }
.tease { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--gold); color: #1b1407; font-weight: 600; font-size: 15px; }
#guessCat { font-size: 15px; }
.guess-opt { width: 100%; font-size: 16px; line-height: 1.25; padding: 8px 16px; }
.guess-opt.right { background: #2E8A55; color: #fff; box-shadow: none; opacity: 1; }
.guess-opt.wrong { background: var(--accent); color: #fff; box-shadow: none; opacity: 1; }
#guessResult { min-height: 1.4em; margin: 12px 0 0; font-weight: 600; }
#stageWrap { flex: 1; min-height: 0; position: relative; }
#stage { position: absolute; inset: 0; touch-action: none; display: block; }
#bannerSpace { height: var(--banner-h); flex: none; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
  background: var(--overlay);
  animation: fade .18s ease-out;
}
.card {
  width: min(400px, 100%); max-height: 100%; overflow: auto;
  background: var(--surface); border-radius: 22px; padding: 24px 22px 20px;
  box-shadow: 0 18px 50px rgba(5, 12, 35, 0.35);
  text-align: center;
}
.card h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; line-height: 1.2; }
.muted { color: var(--muted); }
.stack { display: grid; gap: 10px; margin-top: 18px; }
.btn {
  min-height: 54px; border-radius: 15px; border: 0; padding: 0 20px;
  font-weight: 600; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:disabled { opacity: .6; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-secondary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn svg { width: 20px; height: 20px; }

#ovStart { background: var(--bg); animation: none; overflow-y: auto; }
.start { display: grid; justify-items: center; text-align: center; gap: 0; width: min(380px, 100%); }
.logo {
  font-family: var(--display); font-weight: 700; font-size: clamp(48px, 15vw, 68px);
  line-height: 1; color: var(--frame); margin: 0; letter-spacing: 0.01em;
}
.tagline { margin: 10px 0 26px; font-size: 18px; color: var(--muted); }
.medallion {
  border-radius: 20px; padding: 7px; background: var(--frame);
  box-shadow: 0 14px 34px rgba(16, 36, 96, 0.28);
}
.medallion canvas { display: block; border-radius: 14px; }
.start .howto { margin: 24px 0 26px; max-width: 32ch; font-size: 15px; color: var(--muted); }
.start .btn { width: 100%; font-size: 19px; min-height: 58px; }
.start .theme-btn {
  margin-top: 18px; min-height: 46px; width: auto; font-size: 17px; padding: 0 18px;
  border-radius: 999px; background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line);
}
.start .howto { margin-top: 18px; }
.mode-sw { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 18px; padding: 4px; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
.mode-sw button { min-width: 110px; min-height: 40px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; font-size: 16px; color: var(--muted); }
.mode-sw button[aria-checked="true"] { background: var(--frame); color: #fff; }
#mode-hard[aria-checked="true"] { background: var(--accent); }
.mode-desc { margin: 8px 0 0; font-size: 14px; color: var(--muted); max-width: 34ch; }
.duel-lines { display: grid; gap: 6px; margin: 14px 0 0; text-align: start; }
.duel-lines p { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--bg); font-weight: 600; font-size: 15px; }
#duelOpp { color: var(--muted); }
#duelCanvas { display: block; margin: 14px auto 0; border-radius: 12px; }
#dayCanvas { display: block; margin: 14px auto 0; border-radius: 12px; }
/* browser build: day game only, so no collection, no exit */
.web #btnCollection, .web #btnExit { display: none; }
#duelInput {
  width: 100%; min-height: 52px; margin-top: 14px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); font: 600 18px var(--font); letter-spacing: 0.04em; text-transform: uppercase; text-align: center;
}
#duelErr, #duelNote { min-height: 1.4em; margin: 8px 0 0; font-size: 14px; color: var(--accent); overflow-wrap: anywhere; }
#duelNote { color: var(--muted); }
.start-info { margin: 12px 0 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.start .stack { width: 100%; margin-top: 0; }
.link-btn { margin-top: 14px; border: 0; background: none; color: var(--muted); font-size: 15px; text-decoration: underline; padding: 8px; }

.go-score { font-size: 56px; font-weight: 600; line-height: 1.05; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
.record { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; background: var(--gold); color: #1b1407; font-weight: 600; font-size: 14px; }
#goNote { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--muted); }

#ovPattern .card { padding-top: 26px; }
.done-frame {
  display: inline-block; padding: 8px; border-radius: 18px; background: var(--gold);
  animation: rise .5s cubic-bezier(.2, .9, .3, 1.2);
}
.done-frame canvas { display: block; border-radius: 12px; }
#doneTitle { margin-top: 18px; }

.theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.theme-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; align-items: center; column-gap: 10px; row-gap: 1px;
  min-width: 0; min-height: 56px; padding: 8px 10px; border: 0; border-radius: 14px; text-align: start;
  background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line);
}
.theme-item.current { box-shadow: inset 0 0 0 3px var(--gold); }
.theme-flag { grid-row: span 2; font-size: 26px; line-height: 1; display: grid; place-items: center; }
.theme-name { font-weight: 600; font-size: 14px; line-height: 1.2; min-width: 0; hyphens: auto; }
.theme-prog { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cini-badge { width: 26px; height: 26px; border-radius: 6px; display: block; }
.col-tabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px -4px 4px; padding: 4px; scrollbar-width: none; }
.col-tabs::-webkit-scrollbar { display: none; }
.col-tab {
  flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; font-size: 24px; line-height: 1;
  display: grid; place-items: center; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line);
}
.col-tab[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--gold); }
#colTheme { text-align: start; margin: 8px 0 0; font-size: 16px; }
.credits { text-align: start; }
#creditList { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
#creditList li { display: grid; gap: 2px; font-size: 14px; }
#creditList small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; text-align: start; }
.col-head h2 { margin: 0; }
#colCount { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.col-hint { text-align: start; margin: 6px 0 16px; font-size: 14px; }
#colGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.col-item { margin: 0; display: grid; gap: 6px; justify-items: center; }
.col-item canvas { width: 100%; aspect-ratio: 1; border-radius: 12px; display: block; box-shadow: inset 0 0 0 1px var(--line); }
.col-item.current canvas { outline: 3px solid var(--gold); outline-offset: 2px; }
.col-item figcaption { display: grid; font-size: 13px; line-height: 1.25; }
.col-name { font-weight: 600; }
.col-item:not(.owned):not(.current) .col-name { color: var(--muted); font-weight: 400; }
.col-prog { color: var(--muted); font-size: 12px; }

.settings { text-align: start; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); }
.row label, .row span { font-weight: 600; }
.switch {
  width: 54px; height: 32px; border-radius: 16px; border: 0; padding: 0; position: relative;
  background: var(--line); transition: background .15s;
}
.switch::before {
  content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s;
}
.switch[aria-checked="true"] { background: var(--frame); }
.switch[aria-checked="true"]::before { transform: translateX(22px); }
[dir="rtl"] .switch[aria-checked="true"]::before { transform: translateX(-22px); }
select {
  min-height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg);
  padding: 0 10px; max-width: 60%;
}
.settings h3 { margin: 18px 0 4px; font-size: 15px; }
.settings p { margin: 0; font-size: 14px; color: var(--muted); }
#version { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; white-space: pre-line; }

#ovAd { background: #05091A; color: #fff; z-index: 20; animation: none; }
.ad-box { display: grid; gap: 14px; justify-items: center; text-align: center; }
#adCount { font-size: 56px; font-weight: 600; font-variant-numeric: tabular-nums; }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: scale(.8); opacity: 0; } }
@keyframes pop { 50% { transform: scale(1.18); } }
@keyframes stampIn { from { transform: scale(2.2) rotate(-12deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .overlay, .done-frame, #btnGuess.pop, .stamp, #moves.low { animation: none; }
  #patBar { transition: none; }
}
@media (max-height: 640px) {
  #score { font-size: 32px; }
  .hud { padding-top: 6px; }
  .progress { margin-top: 6px; }
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <button class="icon-btn" id="btnCollection" data-i18n-label="collection" aria-label="Collection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5l2.6 3.2 4.1-.4-.4 4.1 3.2 2.6-3.2 2.6.4 4.1-4.1-.4L12 22.5l-2.6-3.2-4.1.4.4-4.1L2.5 12l3.2-2.6-.4-4.1 4.1.4z"/><circle cx="12" cy="12" r="3.4" fill="var(--surface)"/></svg>
    </button>
    <div class="scorebox" aria-live="polite">
      <div id="score">0</div>
      <div id="best">Best 0</div>
      <div id="moves"></div>
    </div>
    <button class="icon-btn" id="btnSettings" data-i18n-label="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.3"/><circle cx="10" cy="17" r="2.3"/></svg>
    </button>
  </header>
  <div class="progress">
    <button id="btnTheme" data-i18n-label="chooseCountry" aria-label="Choose a country">
      <span id="patFlag"></span><span id="patDot"></span><span id="patName"></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <span class="bar"><i id="patBar"></i></span>
    <span id="patCount">0/64</span>
    <button class="mini-btn" id="btnGuess" data-i18n-label="guess" aria-label="Guess" hidden>❓</button>
    <button class="mini-btn" id="btnHint" data-i18n-label="hint" aria-label="Hint" hidden>💡</button>
  </div>
  <div id="stageWrap"><canvas id="stage"></canvas></div>
  <div id="bannerSpace"></div>
</div>

<div class="overlay" id="ovStart" role="dialog" aria-modal="true" aria-labelledby="logo">
  <div class="start">
    <h1 class="logo" id="logo">Moxen</h1>
    <p class="tagline" data-i18n="tagline">Place blocks, reveal the tiles.</p>
    <div class="medallion"><canvas id="startCanvas" width="168" height="168"></canvas></div>
    <button class="btn theme-btn" id="btnStartTheme" data-i18n-label="chooseCountry"><span id="startTheme"></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="btn theme-btn" id="btnDaily" hidden></button>
    <div class="mode-sw" role="radiogroup" aria-label="Mode">
      <button id="mode-easy" role="radio" aria-checked="true" data-i18n="modeEasy">Easy</button>
      <button id="mode-hard" role="radio" aria-checked="false" data-i18n="modeHard">Hard</button>
    </div>
    <p class="mode-desc" id="modeDesc"></p>
    <p class="start-info" id="startInfo" hidden></p>
    <p class="howto" data-i18n="howTo"></p>
    <div class="stack">
      <button class="btn btn-primary" id="btnPlay">Play</button>
      <button class="btn btn-secondary" id="btnDayGame" data-i18n="dayGameBtn">📅 Game of the Day</button>
      <button class="btn btn-secondary" id="btnRestartPhoto" data-i18n="restartPhoto" hidden>Start this photo over</button>
      <button class="btn btn-secondary" id="btnDuel" data-i18n="duelMenu">⚔️ Duel</button>
    </div>
    <button class="link-btn" id="btnStartExit" data-i18n="exitGame">Exit game</button>
  </div>
</div>

<div class="overlay" id="ovGameOver" role="dialog" aria-modal="true" aria-labelledby="goTitle" hidden>
  <div class="card">
    <h2 id="goTitle" data-i18n="gameOver">No room left</h2>
    <div class="muted" data-i18n="score">Score</div>
    <div class="go-score" id="goScore">0</div>
    <div class="muted" id="goBest"></div>
    <div class="record" id="goRecord" data-i18n="newRecord" hidden>New best!</div>
    <div class="tease" id="goTease" hidden></div>
    <p id="goNote" role="status"></p>
    <div class="stack">
      <button class="btn btn-primary" id="btnRevive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l10.5-6.5z"/></svg>
        <span data-i18n="watchContinue">Watch an ad to continue</span>
      </button>
      <button class="btn btn-secondary" id="btnRestart" data-i18n="restart">Play again</button>
    </div>
  </div>
</div>

<div class="overlay" id="ovPattern" role="dialog" aria-modal="true" aria-labelledby="doneTitle" hidden>
  <div class="card">
    <div class="done-frame"><canvas id="doneCanvas"></canvas></div>
    <h2 id="doneTitle"></h2>
    <div class="muted" id="doneSub"></div>
    <div class="stamp" id="doneStamp" hidden><span id="doneStampFlag"></span><span data-i18n="stamped">Passport stamped!</span></div>
    <div class="fact" id="doneFact" hidden><b data-i18n="didYouKnow">Did you know?</b><p id="doneFactText"></p></div>
    <div class="stack">
      <button class="btn btn-primary" id="btnNext" data-i18n="next">On to the next tile</button>
      <button class="btn btn-secondary" id="btnShare" data-i18n="share" hidden>Share</button>
      <button class="btn btn-secondary" id="btnDoneTheme" data-i18n="chooseCountry" hidden>Choose a country</button>
    </div>
  </div>
</div>

<div class="overlay" id="ovCollection" role="dialog" aria-modal="true" aria-labelledby="colTitle" hidden>
  <div class="card">
    <div class="col-head"><h2 id="colTitle" data-i18n="collection">Collection</h2><span id="colCount"></span></div>
    <p class="col-hint muted" data-i18n="collectionHint"></p>
    <div id="passport"></div>
    <div class="col-tabs" id="colTabs"></div>
    <h3 id="colTheme"></h3>
    <div id="colGrid"></div>
    <div class="stack"><button class="btn btn-secondary" data-close="ovCollection" data-i18n="close">Close</button></div>
  </div>
</div>

<div class="overlay" id="ovSettings" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <div class="card settings">
    <h2 id="setTitle" data-i18n="settings">Settings</h2>
    <div class="row"><span id="lblSound" data-i18n="sound">Sound</span><button class="switch" id="swSound" role="switch" aria-checked="true" aria-labelledby="lblSound"></button></div>
    <div class="row"><span id="lblVibe" data-i18n="vibration">Vibration</span><button class="switch" id="swVibe" role="switch" aria-checked="true" aria-labelledby="lblVibe"></button></div>

<script>/* Mosaica core logic: no DOM, testable in Node. */
(function (root) {
  'use strict';
  var N = 8;

  // shape text, weight (higher = more common)
  var SHAPE_DEFS = [
    ['#', 3],
    ['##', 4], ['#\n#', 4],
    ['###', 5], ['#\n#\n#', 5],
    ['####', 4], ['#\n#\n#\n#', 4],
    ['#####', 2], ['#\n#\n#\n#\n#', 2],
    ['##\n##', 6],
    ['###\n###\n###', 2],
    ['##\n#.', 3], ['##\n.#', 3], ['#.\n##', 3], ['.#\n##', 3],
    ['###\n#..\n#..', 2], ['###\n..#\n..#', 2], ['#..\n#..\n###', 2], ['..#\n..#\n###', 2],
    ['###\n.#.', 3], ['.#.\n###', 3], ['#.\n##\n#.', 3], ['.#\n##\n.#', 3],
    ['.##\n##.', 2], ['##.\n.##', 2], ['#.\n##\n.#', 2], ['.#\n##\n#.', 2],
    ['###\n###', 3], ['##\n##\n##', 3],
    ['#..\n###', 2], ['..#\n###', 2], ['###\n#..', 2], ['###\n..#', 2],
    ['##\n#.\n#.', 2], ['##\n.#\n.#', 2], ['#.\n#.\n##', 2], ['.#\n.#\n##', 2]
  ];

  var SHAPES = SHAPE_DEFS.map(function (d, id) {
    var rows = d[0].split('\n');
    var cells = [];
    for (var r = 0; r < rows.length; r++) {
      for (var c = 0; c < rows[r].length; c++) {
        if (rows[r][c] === '#') cells.push([r, c]);
      }
    }
    var w = 0;
    rows.forEach(function (row) { if (row.length > w) w = row.length; });
    return { id: id, cells: cells, w: w, h: rows.length, n: cells.length, weight: d[1] };
  });
  var TOTAL_WEIGHT = SHAPES.reduce(function (s, p) { return s + p.weight; }, 0);

  /* Rotations. Variants missing from SHAPES get ids after the base list (weight 0, never dealt).
     Built once in a fixed order so ids stay stable for saved games. */
  var ALL = SHAPES.slice(), BY_KEY = {};
  function cellKey(cells) { return cells.map(function (c) { return c[0] + ':' + c[1]; }).sort().join(','); }
  SHAPES.forEach(function (s) { BY_KEY[cellKey(s.cells)] = s; });
  function rotateCW(shape) {
    if (shape.rot != null) return ALL[shape.rot];
    var cells = shape.cells.map(function (c) { return [c[1], shape.h - 1 - c[0]]; });
    cells.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    var k = cellKey(cells), s = BY_KEY[k];
    if (!s) {
      s = { id: ALL.length, cells: cells, w: shape.h, h: shape.w, n: cells.length, weight: 0 };
      ALL.push(s); BY_KEY[k] = s;
    }
    shape.rot = s.id;
    return s;
  }
  for (var si = 0; si < SHAPES.length; si++) {
    var rs = SHAPES[si];
    for (var q = 0; q < 3; q++) rs = rotateCW(rs);
  }
  function shapeById(id) { return ALL[id] || null; }
  function rotations(shape) {
    var out = [shape], s = rotateCW(shape);
    while (s !== shape && out.length < 4) { out.push(s); s = rotateCW(s); }
    return out;
  }

  var COLORS = 6; // color indices 1..6
  var LINE_PTS = [0, 100, 250, 450, 700, 1000, 1350, 1750, 2200];
  var CLEAN_BONUS = 1000;

  function newBoard() { return new Uint8Array(N * N); }

  function fits(board, shape, r, c) {
    if (r < 0 || c < 0 || r + shape.h > N || c + shape.w > N) return false;
    for (var i = 0; i < shape.cells.length; i++) {
      var cell = shape.cells[i];
      if (board[(r + cell[0]) * N + (c + cell[1])] !== 0) return false;
    }
    return true;
  }

  function canPlaceAnywhere(board, shape) {
    for (var r = 0; r <= N - shape.h; r++) {
      for (var c = 0; c <= N - shape.w; c++) {
        if (fits(board, shape, r, c)) return true;
      }
    }
    return false;
  }

  function canPlaceAnyRotation(board, shape) {
    return rotations(shape).some(function (s) { return canPlaceAnywhere(board, s); });
  }

  function place(board, shape, r, c, color) {
    var b = new Uint8Array(board);
    for (var i = 0; i < shape.cells.length; i++) {
      var cell = shape.cells[i];
      b[(r + cell[0]) * N + (c + cell[1])] = color;
    }
    return b;
  }

  function findClears(board) {
    var rows = [], cols = [];
    for (var r = 0; r < N; r++) {
      var full = true;
      for (var c = 0; c < N; c++) if (board[r * N + c] === 0) { full = false; break; }
      if (full) rows.push(r);
    }
    for (var c2 = 0; c2 < N; c2++) {
      var fullc = true;
      for (var r2 = 0; r2 < N; r2++) if (board[r2 * N + c2] === 0) { fullc = false; break; }
      if (fullc) cols.push(c2);
    }
    return { rows: rows, cols: cols, lines: rows.length + cols.length };
  }

  function clearedCells(clears) {
    var set = {};
    clears.rows.forEach(function (r) { for (var c = 0; c < N; c++) set[r * N + c] = 1; });
    clears.cols.forEach(function (c) { for (var r = 0; r < N; r++) set[r * N + c] = 1; });
    return Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
  }

  function isEmpty(board) {
    for (var i = 0; i < board.length; i++) if (board[i] !== 0) return false;
    return true;
  }

  function canClearWith(board, shape) {
    for (var r = 0; r <= N - shape.h; r++) {
      for (var c = 0; c <= N - shape.w; c++) {
        if (fits(board, shape, r, c)) {
          if (findClears(place(board, shape, r, c, 1)).lines > 0) return true;
        }
      }
    }
    return false;
  }

  // Hard mode: big and awkward pieces come up more, tiny ones rarely
  function hardWeight(p) { return p.weight * (p.n >= 5 ? 2.6 : p.n === 4 ? 1.6 : p.n <= 2 ? 0.3 : 1); }

  function pickWeighted(rng, filter, weightOf) {
    var pool = filter ? SHAPES.filter(filter) : SHAPES;
    var w = weightOf || function (p) { return p.weight; };
    var total = pool.reduce(function (s, p) { return s + w(p); }, 0);
    var x = rng() * total;
    for (var i = 0; i < pool.length; i++) {
      x -= w(pool[i]);
      if (x <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function fillRatio(board) {
    var n = 0;
    for (var i = 0; i < board.length; i++) if (board[i]) n++;
    return n / board.length;
  }

  /* Picks 3 pieces. Early on it leans on helpful sets, later it gets stricter.
     Hard mode skips the help and leans on big pieces; it still avoids a tray where nothing fits. */
  function generateTray(board, rng, score, hard) {
    var help = hard ? 0 : Math.max(0.25, 1 - (score || 0) / 25000);
    var fill = fillRatio(board);
    var best = null, bestVal = -Infinity;
    var tries = hard ? 6 : 10 + Math.round(help * 10);
    var w = hard ? hardWeight : null;
    for (var t = 0; t < tries; t++) {
      var set = [pickWeighted(rng, null, w), pickWeighted(rng, null, w), pickWeighted(rng, null, w)];
      var fitCount = 0, clearable = 0, size = 0;
      for (var i = 0; i < 3; i++) {
        if (canPlaceAnyRotation(board, set[i])) fitCount++;
        if (fill > 0.25 && canClearWith(board, set[i])) clearable++;
        size += set[i].n;
      }
      var val = rng() * 12;
      if (fitCount === 0) val -= 1000;
      val += fitCount * 8 * help;
      val += clearable * 5 * help;
      if (fill > 0.55) val -= size * 0.6 * help;
      if (val > bestVal) { bestVal = val; best = set; }
    }
    return best;
  }

  /* Duel trays: a fixed piece sequence from a seeded rng, the same for both players
     whatever they do on the board. */
  function sequenceTray(rng, hard) {
    var w = hard ? hardWeight : null;
    return [pickWeighted(rng, null, w), pickWeighted(rng, null, w), pickWeighted(rng, null, w)];
  }

  /* Revive: every piece fits; prefer small useful pieces. */
  function generateReviveTray(board, rng) {
    var out = [];
    var fitting = SHAPES.filter(function (s) { return s.n <= 4 && canPlaceAnywhere(board, s); });
    if (!fitting.length) fitting = [SHAPES[0]];
    var clearing = fitting.filter(function (s) { return canClearWith(board, s); });
    for (var i = 0; i < 3; i++) {
      var pool = (clearing.length && i < 2) ? clearing : fitting;
      out.push(pool[Math.floor(rng() * pool.length)]);
    }
    return out;
  }

  function scoreMove(pieceCells, lines, combo, boardClean) {
    var pts = pieceCells;
    if (lines > 0) {
      var base = LINE_PTS[Math.min(lines, LINE_PTS.length - 1)];
      pts += base * Math.max(1, combo);
    }
    if (boardClean) pts += CLEAN_BONUS;
    return pts;
  }

  /* Combo: grows on each clearing move, survives up to 2 moves without a clear. */
  function nextCombo(state, cleared) {
    if (cleared) {
      return { combo: state.miss < 3 ? state.combo + 1 : 1, miss: 0 };
    }
    var miss = state.miss + 1;
    return { combo: miss >= 3 ? 0 : state.combo, miss: miss };
  }

  function anyFits(board, tray) {
    for (var i = 0; i < tray.length; i++) {
      if (tray[i] && canPlaceAnyRotation(board, tray[i].shape)) return true;
    }
    return false;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* Day game: everyone gets the same random stream on the same date. The seed is an FNV-1a hash
     of the date string (YYYY-MM-DD), so it needs no server and no clock other than the date. */
  function dateSeed(day) {
    var h = 0x811c9dc5;
    var s = 'moxen-day:' + String(day);
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;

  }

  var api = {
    N: N, SHAPES: SHAPES, COLORS: COLORS, LINE_PTS: LINE_PTS,
    newBoard: newBoard, fits: fits, canPlaceAnywhere: canPlaceAnywhere, canPlaceAnyRotation: canPlaceAnyRotation, place: place,
    rotateCW: rotateCW, rotations: rotations, shapeById: shapeById,
    findClears: findClears, clearedCells: clearedCells, isEmpty: isEmpty,
    canClearWith: canClearWith, generateTray: generateTray, sequenceTray: sequenceTray, generateReviveTray: generateReviveTray,
    scoreMove: scoreMove, nextCombo: nextCombo, anyFits: anyFits, fillRatio: fillRatio,
    mulberry32: mulberry32, dateSeed: dateSeed, dayRng: dayRng, isDayKey: isDayKey
  };

</script>

<script>/* Mosaica themes: one interface over the drawn tile set ('cini') and the photo countries. */
(function (root) {

  var CATEGORIES = root.MosaicaCategories || {}, FACTS = root.MosaicaFacts || {}, DECOYS = root.MosaicaDecoys || {};

  /* Content packs (content-<lang>.js) add names, facts and decoys for more languages. */
  var PACKS = root.MosaicaContent || {};
  Object.keys(PACKS).forEach(function (lang) {
    COUNTRIES.forEach(function (c) {
      c.items.forEach(function (it) {

    var px = Math.round(L.size * L.dpr);
    patCanvas = TH.makeCanvas(progress.theme, prog.index, px);
    patGhost = document.createElement('canvas');
    patGhost.width = patGhost.height = px;
    var gg = patGhost.getContext('2d');
    if (TH.isPhoto(progress.theme)) {
      // photos stay a blurred hint until revealed
      if (patCanvas.ready) { gg.filter = 'blur(' + Math.round(px * 0.025) + 'px)'; gg.globalAlpha = 0.16; gg.drawImage(patCanvas, 0, 0); }
      if (!duel) TH.image(progress.theme, prog.index + 1);
    } else {
      gg.globalAlpha = 0.09;
      gg.drawImage(patCanvas, 0, 0);
    }
  }

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, gr = (n >> 8) & 255, b = n & 255;
    function f(v) { return clamp(Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)), 0, 255); }
    return 'rgb(' + f(r) + ',' + f(gr) + ',' + f(b) + ')';
  }

  function tileFor(color, size) {
    var key = color + '@' + size;
    if (tileCache[key]) return tileCache[key];
    var px = Math.max(4, Math.round(size * L.dpr));
    var c = document.createElement('canvas'); c.width = c.height = px;
    var x = c.getContext('2d'), base = GLAZE[color], ins = px * 0.055, r = px * 0.17;
    rr(x, ins, ins, px - ins * 2, px - ins * 2, r);
    var grd = x.createLinearGradient(0, 0, 0, px);
    grd.addColorStop(0, shade(base, 0.28)); grd.addColorStop(0.55, base); grd.addColorStop(1, shade(base, -0.25));
    x.fillStyle = grd; x.fill();
    x.lineWidth = px * 0.04; x.strokeStyle = shade(base, -0.35); x.stroke();
    x.save(); x.clip();
    x.fillStyle = 'rgba(255,255,255,0.22)';
    x.beginPath(); x.ellipse(px * 0.32, px * 0.24, px * 0.34, px * 0.16, -0.5, 0, Math.PI * 2); x.fill();
    x.restore();
    var cx = px / 2, cy = px / 2, pr = px * 0.085;
    x.fillStyle = 'rgba(255,255,255,0.62)';
    for (var k = 0; k < 4; k++) {
      var a = k * Math.PI / 2 + Math.PI / 4;
      x.beginPath(); x.arc(cx + Math.cos(a) * pr * 1.25, cy + Math.sin(a) * pr * 1.25, pr, 0, Math.PI * 2); x.fill();
    }
    x.fillStyle = shade(base, -0.3);
    x.beginPath(); x.arc(cx, cy, pr * 0.75, 0, Math.PI * 2); x.fill();
    tileCache[key] = c;
    return c;
  }

  /* ---------- animation state ---------- */
  var dirty = true, raf = 0;
  var popAt = new Float64Array(64), revealAt = new Float64Array(64);
  var anims = [], particles = [], floats = [];
  var drag = null, busy = false, shakeUntil = 0;
  var returnAnim = null, spinAnim = null;
  var TAP_SLOP = 9, TAP_MS = 450;

  function markDirty() { dirty = true; if (!raf) raf = requestAnimationFrame(frame); }

  function frame() {
    raf = 0;
    ensureTray();
    var tnow = now();
    var animating = draw(tnow);
    if (animating || dirty) {
      dirty = false;
      if (animating) raf = requestAnimationFrame(frame);
    }
  }

  function cellXY(i) { return { x: L.bx + (i % N) * L.cell, y: L.by + Math.floor(i / N) * L.cell }; }

  function draw(tn) {
    var animating = false;
    var dpr = L.dpr, cs = L.cell;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, L.W, L.H);

    var sx = 0, sy = 0;
    if (tn < shakeUntil) {
      animating = true;
      var amp = (shakeUntil - tn) / 260 * 4;
      sx = (Math.random() - 0.5) * amp; sy = (Math.random() - 0.5) * amp;
    }
    g.save(); g.translate(sx, sy);

    // frame
    rr(g, L.bx - 7, L.by - 7, L.size + 14, L.size + 14, 16);
    if (prog.golden) {
      var gg2 = g.createLinearGradient(L.bx, L.by, L.bx + L.size, L.by + L.size);
      gg2.addColorStop(0, '#F6D77A'); gg2.addColorStop(0.5, '#B98F34'); gg2.addColorStop(1, '#F2CF6B');
      g.fillStyle = gg2;
    } else g.fillStyle = theme.frame;
    g.fill();
    rr(g, L.bx - 3, L.by - 3, L.size + 6, L.size + 6, 12);
    g.fillStyle = theme.board; g.fill();

    var pcs = patCanvas.width / N;
    var previewSet = null, previewColor = 0;
    if (drag && drag.moved && drag.preview) {
      previewSet = {}; drag.preview.forEach(function (i) { previewSet[i] = 1; });
      previewColor = state.tray[drag.slot].color;
    }
    var ghostSet = null;
    if (drag && drag.moved && drag.land) {
      ghostSet = {};
      var sh = state.tray[drag.slot].shape;
      sh.cells.forEach(function (c) { ghostSet[(drag.land.r + c[0]) * N + drag.land.c + c[1]] = 1; });
    }

    for (var i = 0; i < 64; i++) {
      var p = cellXY(i), v = state.board[i];
      var col = i % N, row = Math.floor(i / N);
      if (prog.revealed[i]) {
        var ra = 1;
        if (revealAt[i] && tn < revealAt[i] + 420) {
          animating = true;
          ra = tn < revealAt[i] ? 0 : easeOut((tn - revealAt[i]) / 420);
        }
        if (ra < 1) {
          rr(g, p.x + 1.5, p.y + 1.5, cs - 3, cs - 3, cs * 0.12); g.fillStyle = theme.cell; g.fill();
          g.drawImage(patGhost, col * pcs, row * pcs, pcs, pcs, p.x, p.y, cs, cs);
        }
        g.globalAlpha = ra;
        g.drawImage(patCanvas, col * pcs, row * pcs, pcs, pcs, p.x, p.y, cs, cs);
        g.globalAlpha = 1;
        if (revealAt[i] && tn >= revealAt[i] && tn < revealAt[i] + 600) {
          g.strokeStyle = theme.gold; g.globalAlpha = 1 - (tn - revealAt[i]) / 600; g.lineWidth = 2;
          g.strokeRect(p.x + 1, p.y + 1, cs - 2, cs - 2); g.globalAlpha = 1;
        }
      } else {
        rr(g, p.x + 1.5, p.y + 1.5, cs - 3, cs - 3, cs * 0.12); g.fillStyle = theme.cell; g.fill();
        g.drawImage(patGhost, col * pcs, row * pcs, pcs, pcs, p.x, p.y, cs, cs);
      }
      if (v) {
        if (previewSet && previewSet[i]) {
          g.drawImage(tileFor(previewColor, cs), p.x, p.y, cs, cs);
        } else {
          var sc = 1;
          if (popAt[i] && tn < popAt[i] + 160 && !reduceMotion) { animating = true; sc = 1 + 0.14 * (1 - (tn - popAt[i]) / 160); }
          var d = cs * sc, o = (cs - d) / 2;
          g.drawImage(tileFor(v, cs), p.x + o, p.y + o, d, d);
        }
      } else if (ghostSet && ghostSet[i]) {
        g.globalAlpha = previewSet && previewSet[i] ? 0.9 : 0.42;
        g.drawImage(tileFor(state.tray[drag.slot].color, cs), p.x, p.y, cs, cs);
        g.globalAlpha = 1;
      }
    }
    if (previewSet) {
      g.save(); g.globalAlpha = 0.55 + 0.25 * Math.sin(tn / 120); animating = true;
      g.strokeStyle = theme.gold; g.lineWidth = 2;
      drag.preview.forEach(function (i) { var p = cellXY(i); g.strokeRect(p.x + 2, p.y + 2, cs - 4, cs - 4); });
      g.restore();
    }

    // clearing tiles
    for (var a = anims.length - 1; a >= 0; a--) {
      var an = anims[a], pp = (tn - an.t0) / 360;
      if (pp >= 1) { anims.splice(a, 1); continue; }
      animating = true;
      var q = cellXY(an.i);
      if (pp < 0) { g.drawImage(tileFor(an.color, cs), q.x, q.y, cs, cs); continue; }
      var e = easeOut(pp), dd = cs * (1 - e * 0.85);
      g.save();
      g.globalAlpha = 1 - e;
      g.translate(q.x + cs / 2, q.y + cs / 2);
      if (!reduceMotion) g.rotate(e * 0.6);
      g.drawImage(tileFor(an.color, cs), -dd / 2, -dd / 2, dd, dd);
      g.restore();
      if (!an.burst) {
        an.burst = true;
        if (!reduceMotion) spawnParticles(q.x + cs / 2, q.y + cs / 2, GLAZE[an.color], 4);
      }
    }
    g.restore();

    // particles
    for (var k = particles.length - 1; k >= 0; k--) {
      var pt = particles[k], age = (tn - pt.t0) / pt.life;
      if (age >= 1) { particles.splice(k, 1); continue; }
      animating = true;
      var tt = (tn - pt.t0) / 1000;
      var px = pt.x + pt.vx * tt, py = pt.y + pt.vy * tt + 380 * tt * tt;
      g.globalAlpha = 1 - age;
      g.fillStyle = pt.color;
      g.save(); g.translate(px, py); g.rotate(pt.rot + tt * 6);
      g.fillRect(-pt.s / 2, -pt.s / 2, pt.s, pt.s);
      g.restore();
    }
    g.globalAlpha = 1;

    // tray
    for (var s = 0; s < 3; s++) {
      var item = state.tray[s];
      if (!item) continue;
      if (drag && drag.moved && drag.slot === s) continue;
      if (returnAnim && returnAnim.slot === s) continue;
      var slot = L.slots[s], tc = L.tcell, shp = item.shape;
      var ox = slot.x + (slot.w - shp.w * tc) / 2, oy = slot.y + (slot.h - shp.h * tc) / 2;
      var fitsAny = C.canPlaceAnyRotation(state.board, shp);
      g.save();
      g.globalAlpha = fitsAny ? 1 : 0.32;
      if (spinAnim && spinAnim.slot === s) {
        var sp = (tn - spinAnim.t0) / 170;
        if (sp >= 1 || reduceMotion) spinAnim = null;
        else {
          animating = true;
          var scx = slot.x + slot.w / 2, scy = slot.y + slot.h / 2;
          g.translate(scx, scy); g.rotate(-(1 - easeOut(sp)) * Math.PI / 2); g.translate(-scx, -scy);
        }
      }
      shp.cells.forEach(function (c) { g.drawImage(tileFor(item.color, tc), ox + c[1] * tc, oy + c[0] * tc, tc, tc); });
      g.restore();
      if (C.rotations(shp).length > 1) drawRotateHint(Math.min(ox + shp.w * tc + 9, slot.x + slot.w - 9), Math.max(oy - 9, slot.y + 9), fitsAny ? 0.6 : 0.25);
    }

    // piece flying back to tray
    if (returnAnim) {
      var rp = (tn - returnAnim.t0) / 180;
      if (rp >= 1) { returnAnim = null; }
      else {
        animating = true;
        var it = state.tray[returnAnim.slot];
        if (it) {
          var sl = L.slots[returnAnim.slot], e2 = easeOut(rp);
          var size = L.cell + (L.tcell - L.cell) * e2;
          var tx = sl.x + (sl.w - it.shape.w * L.tcell) / 2, ty = sl.y + (sl.h - it.shape.h * L.tcell) / 2;
          var fx = returnAnim.x + (tx - returnAnim.x) * e2, fy = returnAnim.y + (ty - returnAnim.y) * e2;
          it.shape.cells.forEach(function (c) { g.drawImage(tileFor(it.color, L.cell), fx + c[1] * size, fy + c[0] * size, size, size); });
        }
      }
    }

    // dragged piece
    if (drag && drag.moved) {
      var di = state.tray[drag.slot];
      g.save();
      g.shadowColor = 'rgba(0,0,0,0.28)'; g.shadowBlur = 14; g.shadowOffsetY = 8;
      di.shape.cells.forEach(function (c) { g.drawImage(tileFor(di.color, cs), drag.px + c[1] * cs, drag.py + c[0] * cs, cs, cs); });
      g.restore();
    }

    // floating texts
    for (var f = floats.length - 1; f >= 0; f--) {
      var fl = floats[f], fp = (tn - fl.t0) / fl.dur;
      if (fp >= 1) { floats.splice(f, 1); continue; }
      if (fp < 0) { animating = true; continue; }
      animating = true;
      var rise = easeOut(Math.min(1, fp * 1.4)) * fl.rise;
      var alpha = fp < 0.7 ? 1 : 1 - (fp - 0.7) / 0.3;
      var scale = fp < 0.15 && !reduceMotion ? 0.7 + fp / 0.15 * 0.3 : 1;
      g.save();
      g.globalAlpha = alpha;
      g.translate(fl.x, fl.y - rise); g.scale(scale, scale);
      g.font = '600 ' + fl.size + 'px "Readex Pro", system-ui, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineJoin = 'round'; g.lineWidth = Math.max(3, fl.size * 0.16);
      g.strokeStyle = fl.stroke; g.strokeText(fl.text, 0, 0);
      g.fillStyle = fl.color; g.fillText(fl.text, 0, 0);
      g.restore();
    }
    return animating;
  }

  function drawRotateHint(x, y, alpha) {
    g.save();
    g.globalAlpha = alpha;
    g.strokeStyle = theme.gridline; g.fillStyle = theme.gridline;
    g.lineWidth = 2; g.lineCap = 'round';
    g.beginPath(); g.arc(x, y, 6.5, -Math.PI * 0.35, Math.PI * 1.25); g.stroke();
    var ax = x + Math.cos(-Math.PI * 0.35) * 6.5, ay = y + Math.sin(-Math.PI * 0.35) * 6.5;
    g.beginPath(); g.moveTo(ax + 3.5, ay - 1.5); g.lineTo(ax - 1, ay - 3.5); g.lineTo(ax + 0.5, ay + 2.5); g.closePath(); g.fill();
    g.restore();
  }

  function rotateSlot(slot) {
    var item = state.tray[slot];
    if (!item) return;
    var next = C.rotateCW(item.shape);
    if (next === item.shape) return;
    item.shape = next;
    spinAnim = { slot: slot, t0: now() };
    Sfx.pick(); haptic('light');
    saveGame(); markDirty();
  }

  function spawnParticles(x, y, color, n) {
    var tn = now();
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, t0: tn, life: 520 + Math.random() * 260, s: 3 + Math.random() * 4, color: color, rot: Math.random() * 3 });
    }
    if (particles.length > 260) particles.splice(0, particles.length - 260);
  }

  function addFloat(text, x, y, size, color, delay, dur) {
    x = clamp(x, L.bx + L.size * 0.18, L.bx + L.size * 0.82);
    floats.push({ text: text, x: x, y: y, size: size, color: color || '#fff', stroke: 'rgba(14,26,58,0.85)', t0: now() + (delay || 0), dur: dur || 900, rise: size * 1.4 });
  }

  /* ---------- game flow ---------- */
  function randColor(exclude, rnd) {
    var c;
    do { c = 1 + Math.floor(rnd() * C.COLORS); } while (exclude && exclude.indexOf(c) >= 0 && rnd() < 0.8);
    return c;
  }
  var duel = null; // a duel or a day game: a side game that never touches the saved game or progress
  function nextTray() {
    if (!duel) return C.generateTray(state.board, Math.random, state.score, hard());
    // day game: the normal helpful generator, only fed by the date's seeded stream
    return duel.day ? C.generateTray(state.board, duel.rng, state.score, false) : C.sequenceTray(duel.rng, duel.hard);
  }

  function deal(shapes) {
    var used = [], rnd = duel && duel.day ? duel.rng : Math.random;
    state.tray = shapes.map(function (s) { var c = randColor(used, rnd); used.push(c); return { shape: s, color: c }; });
  }

  function newGame() {
    state = freshState();
    deal(C.generateTray(state.board, Math.random, 0, hard()));
    anims = []; particles = []; floats = [];
    popAt.fill(0); revealAt.fill(0);
    busy = false;
    saveGame(); updateHud(); markDirty();
  }

  function placePiece(slot, r, c) {
    var item = state.tray[slot], sh = item.shape, tn = now();
    prog.movesLeft--;
    state.board = C.place(state.board, sh, r, c, item.color);
    state.tray[slot] = null;
    sh.cells.forEach(function (cc) { popAt[(r + cc[0]) * N + c + cc[1]] = tn; });

    var cl = C.findClears(state.board);
    var cleared = cl.lines ? C.clearedCells(cl) : [];
    var cb = C.nextCombo(state, cl.lines > 0);
    state.combo = cb.combo; state.miss = cb.miss;
    var colors = cleared.map(function (i) { return state.board[i]; });
    cleared.forEach(function (i) { state.board[i] = 0; });
    var clean = cl.lines > 0 && C.isEmpty(state.board);
    var pts = C.scoreMove(sh.n, cl.lines, state.combo, clean);
    state.score += pts;

    var cx = L.bx + (c + sh.w / 2) * L.cell, cy = L.by + (r + sh.h / 2) * L.cell;
    var patternDone = false, fresh = 0;
    if (cl.lines) {
      var pcx = c + sh.w / 2, pcy = r + sh.h / 2;
      cleared.forEach(function (i, k) {
        var d = Math.hypot(Math.floor(i / N) + 0.5 - pcy, (i % N) + 0.5 - pcx);
        var t0 = tn + d * 30;
        anims.push({ i: i, color: colors[k], t0: t0 });
        if (!prog.revealed[i]) { prog.revealed[i] = 1; revealAt[i] = t0 + 140; fresh++; }
      });
      Sfx.clear(cl.lines, state.combo);
      haptic(cl.lines > 1 ? 'medium' : 'light');
      if (cl.lines >= 3 || state.combo >= 3) shakeUntil = reduceMotion ? 0 : tn + 260;
      var big = Math.round(L.cell * 0.62);
      addFloat('+' + fmt(pts), cx, cy, big, '#FFFFFF');
      if (state.combo >= 2) addFloat(t('combo', { n: state.combo }), L.bx + L.size / 2, L.by + L.size * 0.32, Math.round(L.cell * 0.72), theme.gold, 120, 1100);
      if (clean) addFloat(t('clean'), L.bx + L.size / 2, L.by + L.size / 2, Math.round(L.cell * 0.85), '#FFFFFF', 220, 1400);
      patternDone = prog.revealed.every(Boolean);
    } else {
      Sfx.place(); haptic('light');
    }

    if (hard()) state.dry = fresh ? 0 : (state.dry | 0) + 1;
    if (!duel && state.score > best) { best = state.score; store(bestKey(), best); if (!state.record && best > 0 && stats.games > 0) state.record = true; }
    if (state.tray.every(function (p) { return !p; })) deal(nextTray());

    saveProgress(); saveGame(); updateHud(); markDirty();

    var stuck = !C.anyFits(state.board, state.tray);
    if (duel && duel.day) {
      if (patternDone) addFloat(t('dayPhotoDone'), L.bx + L.size / 2, L.by + L.size * 0.4, Math.round(L.cell * 0.5), theme.gold, 400, 1800);
      if (stuck) { busy = true; setTimeout(finishDay, 700); }
      return;
    }
    if (duel) {
      if (patternDone || stuck || prog.movesLeft <= 0) { busy = true; setTimeout(finishDuel, patternDone ? 900 : 600); }
      return;
    }
    if (patternDone) {
      busy = true;
      setTimeout(function () { showPatternDone(stuck); }, 900);
    } else if (stuck) {
      busy = true;
      setTimeout(gameOver, 700);
    } else if (hard() && state.dry >= DRY_LIMIT) {
      busy = true;
      setTimeout(function () { showOutOfMoves('dry'); }, 600);
    } else if (prog.movesLeft <= 0) {
      busy = true;
      setTimeout(showOutOfMoves, 600);
    }
  }

  /* ---------- move limit ---------- */
  function adsForExtension() { return (prog.extensions | 0) === 0 ? 1 : 2; }

  /* kind 'moves': the photo's move budget ran out. kind 'dry': hard mode, DRY_LIMIT moves without a new square. */
  var offerKind = 'moves';
  function showOutOfMoves(kind) {
    offerKind = kind === 'dry' ? 'dry' : 'moves';
    var n = offerKind === 'dry' ? 1 : adsForExtension();
    $('movesTitle').textContent = offerKind === 'dry' ? t('dryTitle', { n: fmt(DRY_LIMIT) }) : t('outOfMoves');
    $('movesSub').textContent = offerKind === 'dry' ? t('drySub', { n: fmt(DRY_LIMIT) })
      : t('outOfMovesSub', { p: fmt(Math.round(revealedCount() / 64 * 100)) });
    $('btnMoreMoves').querySelector('span').textContent = offerKind === 'dry' ? t('dryWatch')
      : t(n === 1 ? 'watchForMoves1' : 'watchForMovesN', { n: fmt(n), m: fmt(EXTRA_MOVES) });
    $('btnMoreMoves').disabled = false;
    $('movesNote').textContent = '';
    Sfx.over(); haptic('medium');
    openOverlay('ovMoves');
  }

  /* After a game-over screen the photo may still be out of moves. */
  function checkMoves() {
    if (state.over) return;
    if (hard() && state.dry >= DRY_LIMIT) { busy = true; setTimeout(function () { showOutOfMoves('dry'); }, 300); }
    else if (prog.movesLeft <= 0) { busy = true; setTimeout(showOutOfMoves, 300); }
  }

  async function buyMoves() {
    var btn = $('btnMoreMoves');
    btn.disabled = true;
    $('movesNote').textContent = t('adLoading');
    var dry = offerKind === 'dry';
    var ok = await Ads.watchRewarded(dry ? 1 : adsForExtension(), { test: t('testAd') });
    btn.disabled = false;
    $('movesNote').textContent = '';
    if (!ok) { $('movesNote').textContent = t('adFailed'); return; }
    if (dry) state.dry = 0;
    else { prog.extensions = (prog.extensions | 0) + 1; prog.movesLeft = EXTRA_MOVES; }
    saveProgress(); saveGame(); updateHud();
    closeOverlay('ovMoves');
    busy = false;
    if (!dry) addFloat('+' + fmt(EXTRA_MOVES) + ' ' + t('movesWord'), L.bx + L.size / 2, L.by + L.size / 2, Math.round(L.cell * 0.6), theme.gold, 100, 1300);
    markDirty();
    if (!dry) checkMoves(); else if (prog.movesLeft <= 0) checkMoves();
  }

  /* Declining closes the photo: it starts again from the first square, on a fresh board. */
  function giveUpPhoto() {
    closeOverlay('ovMoves');
    resetPhoto();
  }

  /* Starts the current photo over (hidden again, full moves) on a fresh board.
     The collection and every other photo stay as they are. */
  function resetPhoto() {
    ['ovMoves', 'ovGameOver', 'ovGuess'].forEach(function (id) { if (!$(id).hidden) closeOverlay(id); });
    prog.revealed = new Array(64).fill(0);
    prog.movesLeft = MOVE_LIMIT; prog.extensions = 0;
    prog.guessed = false; prog.hinted = false;

  /* ---------- duel: same photo, same pieces, shared as a code ---------- */
  /* A duel code is 6 characters (30 bits), shown as K7M-2QX:
     country 5 · photo 3 · mode 1 · piece order 8 · squares revealed 7 · moves used 6.
     The alphabet skips I, L, O and U so the code is easy to read out and type. */
  var CODE_ABC = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  // fixed order: never reorder, only append, or old codes would point to other countries
  var CODE_COUNTRIES = ['tr', 'de', 'fr', 'es', 'it', 'br', 'mx', 'us', 'eg', 'in', 'jp', 'id', 'gb', 'ca', 'au', 'kr', 'ph'];

  function duelCode(d, r) {
    var c = CODE_COUNTRIES.indexOf(d.theme);
    var v = ((((c * 8 + d.idx) * 2 + (d.hard ? 1 : 0)) * 256 + d.seed) * 128 + r.rev) * 64 + r.moves;
    var out = '';
    for (var i = 0; i < 6; i++) { out = CODE_ABC[v % 32] + out; v = Math.floor(v / 32); }
    return out.slice(0, 3) + '-' + out.slice(3);
  }

  function parseDuel(text) {
    var raw = String(text || '').toUpperCase().replace(/[IL]/g, '1').replace(/O/g, '0');
    var m = /([0-9A-Z]{3})-([0-9A-Z]{3})/.exec(raw);
    var code = m ? m[1] + m[2] : raw.replace(/[^0-9A-Z]/g, '');
    if (code.length !== 6) return null;
    var v = 0;
    for (var i = 0; i < 6; i++) {
      var k = CODE_ABC.indexOf(code[i]);
      if (k < 0) return null;
      v = v * 32 + k;
    }
    var moves = v % 64; v = Math.floor(v / 64);
    var rev = v % 128; v = Math.floor(v / 128);
    var seed = v % 256; v = Math.floor(v / 256);
    var isHard = v % 2 === 1; v = Math.floor(v / 2);
    var idx = v % 8, c = Math.floor(v / 8);
    var theme = CODE_COUNTRIES[c];
    if (!theme || !TH.isPhoto(theme) || idx >= TH.count(theme) || rev > 64 || moves > DUEL_MOVES || moves === 0) return null;
    return { theme: theme, idx: idx, hard: isHard, seed: seed, opp: { rev: rev, moves: moves, score: null } };
  }

  function newDuel() {
    var countries = TH.ids.filter(function (id) { return TH.isPhoto(id); });
    var theme = TH.isPhoto(progress.theme) && progress.theme !== 'daily' ? progress.theme : countries[Math.floor(Math.random() * countries.length)];
    startDuel({ theme: theme, idx: Math.floor(Math.random() * TH.count(theme)), seed: Math.floor(Math.random() * 256), hard: hard(), opp: null });
  }

  function startDuel(o) {
    if (duel) endDuel();
    saveGame(); saveProgress();
    var mix = o.seed * 7919 + CODE_COUNTRIES.indexOf(o.theme) * 131 + o.idx * 17 + (o.hard ? 50021 : 1);
    duel = { theme: o.theme, idx: o.idx, seed: o.seed, hard: o.hard, opp: o.opp, day: o.day || null,
             rng: o.day ? C.dayRng(o.day) : C.mulberry32(mix),
             main: { state: state, prog: prog, theme: progress.theme } };
    progress.theme = o.theme;
    prog = { index: o.idx, revealed: new Array(64).fill(0), collection: [], movesLeft: o.day ? Infinity : DUEL_MOVES, extensions: 0, guessed: true, hinted: true };
    state = freshState();
    deal(nextTray());
    anims = []; particles = []; floats = [];
    popAt.fill(0); revealAt.fill(0);
    busy = false;
    ['ovStart', 'ovDuel', 'ovDuelCode', 'ovDuelResult', 'ovDay'].forEach(function (id) { if (!$(id).hidden) closeOverlay(id); });
    Sfx.unlock();
    buildPatternCanvases(); updateHud(); markDirty();
    var hello = o.day ? (o.opp != null ? t('dayBeat', { s: fmt(o.opp) }) : t('dayGo'))
      : o.opp ? t('duelYourTurn', { n: fmt(o.opp.rev), m: fmt(o.opp.moves) }) : t('duelGo', { m: fmt(DUEL_MOVES) });
    addFloat(hello, L.bx + L.size / 2, L.by + L.size / 2, Math.round(L.cell * 0.4), theme.gold, 200, 2600);
  }

  function endDuel() {
    if (!duel) return;
    state = duel.main.state; prog = duel.main.prog; progress.theme = duel.main.theme;
    duel = null;
    anims = []; particles = []; floats = [];
    popAt.fill(0); revealAt.fill(0);
    busy = false;
    if (!IS_WEB) { buildPatternCanvases(); renderStartMedallion(); }
    updateHud(); markDirty();
  }

  function duelResult() { return { rev: revealedCount(), moves: DUEL_MOVES - Math.max(0, prog.movesLeft), score: state.score }; }

  // more squares wins; then fewer moves; then more points
  function duelCompare(a, b) {
    if (a.rev !== b.rev) return a.rev > b.rev ? 1 : -1;
    if (a.moves !== b.moves) return a.moves < b.moves ? 1 : -1;
    if (a.score != null && b.score != null && a.score !== b.score) return a.score > b.score ? 1 : -1;
    return 0;
  }

  function duelLine(who, r) {
    return r.score == null ? t('duelLineShort', { who: who, n: fmt(r.rev), m: fmt(r.moves) })
      : t('duelLine', { who: who, n: fmt(r.rev), m: fmt(r.moves), s: fmt(r.score) });
  }

  function finishDuel() {
    var me = duelResult(), opp = duel.opp, res = opp ? duelCompare(me, opp) : null;
    stats.games++; stats.sinceAd++; saveStats();
    duel.code = duelCode(duel, me);
    duel.me = me;
    (res === 1 || (!opp && me.rev === 64) ? Sfx.done : Sfx.over)(); haptic('medium');
    $('duelTitle').textContent = !opp ? t('duelDone') : res > 0 ? t('duelWin') : res < 0 ? t('duelLose') : t('duelDraw');
    $('duelYou').textContent = duelLine(t('duelYou'), me);
    $('duelOpp').hidden = !opp;
    if (opp) $('duelOpp').textContent = duelLine(t('duelOpp'), opp);
    $('duelHint').textContent = opp ? t('duelHintRematch') : t('duelHintSend');
    $('duelNote').textContent = '';
    $('btnDuelShare').textContent = t(opp ? 'duelShareResult' : 'duelSend');
    var cv = $('duelCanvas'), sz = Math.round(Math.min(200, window.innerWidth * 0.5));
    cv.width = cv.height = Math.round(sz * L.dpr); cv.style.width = cv.style.height = sz + 'px';
    var x = cv.getContext('2d'), cs = cv.width / N;
    TH.draw(x, duel.theme, duel.idx, cv.width);
    x.fillStyle = 'rgba(10,20,48,0.9)';
    for (var k = 0; k < 64; k++) if (!prog.revealed[k]) x.fillRect((k % N) * cs, Math.floor(k / N) * cs, cs + 0.5, cs + 0.5);
    openOverlay('ovDuelResult');
  }

  /* ---------- day game: the same seeded game for everyone on a date, a score to beat, shared as a link ---------- */
  var IS_WEB = !!window.MOXEN_WEB;         // the browser build (web-dist/oyun): day game only, no ads
  var STORE_LIVE = false;                  // true once Moxen is in the stores: "Soon" becomes a download link
  var DAY_URL = 'https://ercgamestudios.github.io/oyun/'; // what the app shares: the GitHub Pages copy of the web build

  function dayUrl(day, score) {
    var base = IS_WEB ? location.origin + location.pathname : DAY_URL;
    return base + '?gun=' + day + '&skor=' + score;
  }
  function dayLabel(day) {
    var p = day.split('-');
    try { return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(lang, { day: 'numeric', month: 'short' }); } catch (e) { return day; }
  }
  // ?gun=YYYY-MM-DD&skor=N from a challenge link; a future date or a broken link is ignored
  function readDayLink() {
    try {
      var q = new URLSearchParams(location.search), d = q.get('gun'), sc = parseInt(q.get('skor'), 10);
      if (!C.isDayKey(d) || d > today) return null;
      return { day: d, opp: isFinite(sc) && sc >= 0 && sc < 1e7 ? sc : null };
    } catch (e) { return null; }
  }
  // the photo under the board comes from the date too, from its own stream so the pieces stay put
  function dayPhoto(day) {
    var countries = CODE_COUNTRIES.filter(function (id) { return TH.isPhoto(id); });
    var r = C.mulberry32(C.dateSeed(day) ^ 0x9E3779B9);
    var th = countries[Math.floor(r() * countries.length)];
    return { theme: th, idx: Math.floor(r() * TH.count(th)) };
  }

  function startDay(day, opp) {
    var ph = dayPhoto(day);
    startDuel({ theme: ph.theme, idx: ph.idx, seed: 0, hard: false, opp: opp == null ? null : opp, day: day });
  }

  function finishDay() {
    var day = duel.day, me = state.score, opp = duel.opp;
    stats.games++; stats.sinceAd++; saveStats();
    var prev = load('day.' + day, 0);
    if (me > prev) store('day.' + day, me);
    duel.me = me;
    Stats.track('finish');
    (opp == null || me >= opp ? Sfx.done : Sfx.over)(); haptic('medium');
    $('dayTitle').textContent = opp == null ? t('dayOver') : me > opp ? t('dayWin') : me < opp ? t('dayLose') : t('dayDraw');
    $('dayYou').textContent = t('dayYou', { s: fmt(me) });
    $('dayOpp').hidden = opp == null;
    if (opp != null) $('dayOpp').textContent = t('dayOpp', { s: fmt(opp) });
    $('dayBestLine').textContent = t('dayBest', { s: fmt(Math.max(me, prev)) });
    $('dayNote').textContent = '';
    var cv = $('dayCanvas'), sz = Math.round(Math.min(200, window.innerWidth * 0.45));
    cv.width = Math.round(sz * L.dpr); cv.height = Math.round(sz * 1.25 * L.dpr);
    cv.style.width = sz + 'px'; cv.style.height = Math.round(sz * 1.25) + 'px';
    cv.getContext('2d').drawImage(makeDayCard(day, me), 0, 0, cv.width, cv.height);
    $('btnDayHome').hidden = IS_WEB;
    $('btnDayStore').hidden = !IS_WEB;
    $('btnDayCredits').hidden = !IS_WEB;
    $('btnDayStore').textContent = STORE_LIVE ? t('download') : t('soonStores');
    openOverlay('ovDay');
  }

  /* Share card: a çini tile from the drawn set (no photo, so nothing to credit), the score and the name. */
  function makeDayCard(day, score) {
    var W = 1080, H = 1350, c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    x.fillStyle = '#0B1530'; x.fillRect(0, 0, W, H);
    var tile = document.createElement('canvas'); tile.width = tile.height = 640;
    TH.draw(tile.getContext('2d'), 'cini', C.dateSeed(day) % TH.count('cini'), 640);
    x.save(); rr(x, 220, 110, 640, 640, 48); x.clip(); x.drawImage(tile, 220, 110); x.restore();
    x.lineWidth = 10; x.strokeStyle = '#D9B55E'; rr(x, 220, 110, 640, 640, 48); x.stroke();
    x.textAlign = 'center'; x.direction = lang === 'ar' ? 'rtl' : 'ltr';
    x.fillStyle = '#C9D4EA'; x.font = '600 46px "Readex Pro", system-ui, sans-serif';
    x.fillText(t('dayGame') + ' · ' + dayLabel(day), W / 2, 850);
    x.fillStyle = '#FFFFFF'; x.font = '700 150px "Readex Pro", system-ui, sans-serif';
    x.fillText(fmt(score), W / 2, 1010);
    x.fillStyle = '#D9B55E'; x.font = '600 50px "Readex Pro", system-ui, sans-serif';
    x.fillText(t('dayCanYou'), W / 2, 1110);
    x.direction = 'ltr';
    x.fillStyle = '#FFFFFF'; x.font = '700 64px "Reem Kufi", "Readex Pro", sans-serif';
    x.fillText('Moxen', W / 2, 1270);
    return c;
  }

  async function shareDay() {
    var btn = $('btnDayShare'), day = duel.day, me = duel.me;
    btn.disabled = true;
    var url = dayUrl(day, me), text = t('dayShareText', { s: fmt(me) }) + ' ' + url;
    var P = window.Capacitor && window.Capacitor.Plugins;
    try {
      var c = makeDayCard(day, me);
      if (Ads.isNative() && P && P.Share && P.Filesystem) {

        await P.Share.share({ title: 'Moxen', text: text, files: [w.uri], dialogTitle: t('share') });
      } else if (navigator.share) {
        var blob = await new Promise(function (res) { c.toBlob(res, 'image/png'); });
        var file = new File([blob], 'moxen.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text: text });

  $('btnDayCredits').addEventListener('click', function () { renderCredits(); openOverlay('ovCredits'); });
  $('mode-easy').addEventListener('click', function () { setMode('easy'); });
  $('mode-hard').addEventListener('click', function () { setMode('hard'); });
  $('btnExit').addEventListener('click', function () { closeOverlay('ovSettings'); confirmExit(); });
  $('btnExitYes').addEventListener('click', exitGame);
  $('btnCollection').addEventListener('click', function () { colTheme = null; renderCollection(); openOverlay('ovCollection'); });
  $('btnTheme').addEventListener('click', function () { if (!busy && !drag && !duel) openThemePicker(); });
  $('btnGuess').addEventListener('click', openGuess);
  $('btnMoreMoves').addEventListener('click', buyMoves);
  $('btnGiveUp').addEventListener('click', giveUpPhoto);
  $('btnHint').addEventListener('click', useHint);
  $('btnGuessClose').addEventListener('click', function () { closeOverlay('ovGuess'); });
  $('btnStartTheme').addEventListener('click', openThemePicker);
  $('btnDaily').addEventListener('click', startDaily);
  $('btnCredits').addEventListener('click', function () { renderCredits(); openOverlay('ovCredits'); });
  TH.onReady(function (th, idx) {
    if (th === progress.theme && idx === prog.index) { buildPatternCanvases(); markDirty(); renderStartMedallion(); }
    if (doneRedraw) doneRedraw();
    if (!$('ovCollection').hidden) renderCollection();
  });
  $('btnSettings').addEventListener('click', function () { renderSettings(); openOverlay('ovSettings'); });
  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () { closeOverlay(b.getAttribute('data-close')); });
  });
  $('btnRevive').addEventListener('click', revive);
  $('btnRestart').addEventListener('click', restart);
  $('swSound').addEventListener('click', function () {
    settings.sound = !settings.sound; saveSettings(); renderSettings();
    if (settings.sound) { Sfx.unlock(); Sfx.pick(); }
  });
  $('swVibe').addEventListener('click', function () {
    settings.vibration = !settings.vibration; saveSettings(); renderSettings();
    haptic('medium');
  });
  $('swRemind').addEventListener('click', async function () {
    if (settings.remind && load('remindOk', false)) { settings.remind = false; saveSettings(); renderSettings(); Reminder.cancel(); return; }
    settings.remind = true; saveSettings();
    await Reminder.ask(); renderSettings();
  });
  $('langSel').addEventListener('change', function (e) {
    lang = e.target.value; settings.lang = lang; saveSettings(); applyLang(); renderSettings(); renderStartMedallion(); renderStartButtons();
  });
  $('btnPrivacy').addEventListener('click', function () { Ads.showPrivacyOptions(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    ['ovCollection', 'ovSettings', 'ovTheme', 'ovCredits', 'ovExit', 'ovDuel', 'ovDuelCode'].forEach(function (id) { if (!$(id).hidden) closeOverlay(id); });
  });

  var hiddenAt = 0, AWAY_MS = 3 * 60 * 1000; // back after this long: show the start menu
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { Sfx.suspend(); saveGame(); hiddenAt = adActive ? 0 : Date.now(); Reminder.schedule(); }
    else {
      Sfx.resume(); ensureTray();
      if (hiddenAt && Date.now() - hiddenAt > AWAY_MS && !adActive && !IS_WEB) showStart();
      hiddenAt = 0;
    }
  });
  window.addEventListener('pagehide', saveGame);

  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () { readTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }
  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(wrap);
  else window.addEventListener('resize', layout);

  /* ---------- store rating & daily reminder ---------- */
  var lastAdAt = 0, DAY_MS = 864e5;
  function plugins() { return Ads.isNative() && window.Capacitor && window.Capacitor.Plugins || {}; }

  /* Native Play rating sheet after the 3rd photo, once more 30+ days later; never in a duel or just after an ad. */
  var Review = {
    due: function () {
      var asked = load('reviewAsked', []);
      if (stats.photos < 3 || asked.length >= 2) return false;
      return !asked.length || Date.now() - asked[asked.length - 1] >= 30 * DAY_MS;
    },
    maybe: function () {
      var R = plugins().InAppReview;
      if (!R || duel || adActive || !$('ovAd').hidden || Date.now() - lastAdAt < 60000 || !Review.due()) return;
      var asked = load('reviewAsked', []); asked.push(Date.now()); store('reviewAsked', asked);
      setTimeout(function () { if (!duel && !adActive) R.requestReview().catch(function () {}); }, 600);
    }
  };

  /* One local notification a day around 19:00, for the next week; rewritten every time the app goes to the background. */
  var REMIND_IDS = [701, 702, 703, 704, 705, 706, 707], REMIND_HOUR = 19;
  var Reminder = {
    cancel: function () {
      var N = plugins().LocalNotifications;
      if (N) return N.cancel({ notifications: REMIND_IDS.map(function (id) { return { id: id }; }) }).catch(function () {});
    },
    /* Asks for permission (Android 13+ shows the system dialog); remembers the answer. */
    ask: async function () {
      var N = plugins().LocalNotifications;
      store('remindAsked', true);
      if (!N) return false;
      try {
        var p = await N.checkPermissions();
        if (p.display !== 'granted') p = await N.requestPermissions();
        var ok = p.display === 'granted';
        store('remindOk', ok);
        if (ok) Reminder.schedule();
        return ok;
      } catch (e) { return false; }
    },
    schedule: async function () {
      var N = plugins().LocalNotifications;
      if (!N || !settings.remind || !load('remindOk', false)) return;
      try {
        var p = await N.checkPermissions();
        if (p.display !== 'granted') { store('remindOk', false); return; }
        await Reminder.cancel();
        var now = new Date(), first = new Date(now.getFullYear(), now.getMonth(), now.getDate(), REMIND_HOUR, 0, 0);
        // today only if 19:00 is still ahead and today's mystery is not solved yet
        if (first <= now || dailySolved()) first.setDate(first.getDate() + 1);
        var d = progress.daily, alive = d.streak > 0 && (d.last === today || d.last === yesterday);
        var list = REMIND_IDS.map(function (id, k) {
          var at = new Date(first.getFullYear(), first.getMonth(), first.getDate() + k, REMIND_HOUR, 0, 0);
          return {
            id: id, title: t('remindTitle'),
            body: k === 0 && alive ? t('remindStreak', { n: fmt(d.streak) }) : t('remindBody'),
            schedule: { at: at, allowWhileIdle: true },
            smallIcon: 'ic_stat_moxen', iconColor: '#2E7D9A'
          };
        });
        await N.schedule({ notifications: list });
      } catch (e) {}
    }
  };

  /* Runs when the player moves on from a finished photo. */
  function afterPhoto() {
    if (duel) return;
    if (stats.photos >= 1 && !load('remindAsked', false) && plugins().LocalNotifications) {
      if (settings.remind) setTimeout(function () { Reminder.ask(); }, 500);
      else store('remindAsked', true);
      return; // one system prompt at a time
    }
    Review.maybe();
  }

  /* ---------- boot ---------- */
  readTheme();
  state = loadGame();
  var resumed = !!state;
  if (!state) newGame();
  applyLang();
  layout();
  if (!IS_WEB) {
    renderStartMedallion(); renderStartButtons();
    if (resumed && !C.anyFits(state.board, state.tray)) { busy = true; setTimeout(gameOver, 400); }
    else checkMoves();
  }

  // the browser build opens straight into the day game, or the one a challenge link points to
  if (IS_WEB) {
    document.documentElement.classList.add('web');
    var link = readDayLink();
    if (link) Stats.track('open_link');
    closeOverlay('ovStart');
    startDay(link ? link.day : today, link ? link.opp : null);
  }

  if (!IS_WEB) Ads.init({
    onPause: function () { adActive = true; lastAdAt = Date.now(); Sfx.suspend(); },
    onResume: function () { adActive = false; lastAdAt = Date.now(); Sfx.resume(); },
    onBannerHeight: function (h) {
      document.documentElement.style.setProperty('--banner-h', Math.round(h) + 'px');
      layout();
    }
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(markDirty);
  Reminder.schedule();
  window.__mosaica = { state: function () { return state; }, progress: function () { return progress; }, card: makeShareCard, duel: function () { return duel; }, finishDay: function () { if (duel && duel.day) finishDay(); }, afterPhoto: afterPhoto, reminder: Reminder };
})();
</script>
</body>
